# Configuração de prompts para análise de imagens
# Bloco Suvaco de Cristo - Catalogação de Acervo

# Contexto sobre o Bloco Suvaco de Cristo
contexto:
  nome: "Suvaco de Cristo"
  local: "Rio de Janeiro, Brasil"
  evento: "Carnaval"
  descricao: |
    O Bloco Suvaco de Cristo é um tradicional bloco de carnaval do Rio de Janeiro.
    As imagens do acervo documentam a história, cultura e momentos marcantes do bloco ao longo dos anos.

# =============================================================================
# PROMPT 1: CAPTIONING / DESCRIÇÃO DE IMAGENS
# =============================================================================

caption:
  # JSON Schema para validação da saída
  output_schema:
    type: object
    required:
      - descricao_curta
      - descricao_longa
      - palavras_chave
      - elementos_visuais
      - contexto_temporal
      - analise_cultural
      - qualidade_tecnica
    properties:
      descricao_curta:
        type: string
        minLength: 1
      descricao_longa:
        type: string
        minLength: 1
      palavras_chave:
        type: array
        items:
          type: string
        minItems: 1
      elementos_visuais:
        type: object
        required:
          - pessoas
          - cenario
          - objetos
          - cores_predominantes
        properties:
          pessoas:
            type: string
          cenario:
            type: string
          objetos:
            type: string
          cores_predominantes:
            type: array
            items:
              type: string
      contexto_temporal:
        type: object
        required:
          - epoca_estimada
          - indicadores
        properties:
          epoca_estimada:
            type: string
          indicadores:
            type: string
      analise_cultural:
        type: object
        required:
          - elementos_carnavalescos
          - referencias_culturais
          - significado
        properties:
          elementos_carnavalescos:
            type: string
          referencias_culturais:
            type: string
          significado:
            type: string
      qualidade_tecnica:
        type: object
        required:
          - tipo
          - qualidade
          - observacoes
        properties:
          tipo:
            type: string
          qualidade:
            type: string
          observacoes:
            type: string
      observacoes_adicionais:
        type: string

  system_prompt: |
    Você é um especialista em análise de imagens culturais e patrimônio histórico brasileiro, com foco especial em carnaval carioca e manifestações culturais populares.

    Sua tarefa é analisar imagens do acervo histórico do Bloco Suvaco de Cristo e gerar descrições detalhadas, precisas e estruturadas que preservem o contexto histórico e cultural.

  user_prompt: |
    ## CONTEXTO
    Esta imagem faz parte do acervo histórico do Bloco "Suvaco de Cristo", um tradicional
    bloco de carnaval do Rio de Janeiro, Brasil. O acervo documenta a história do bloco
    através de fotografias, vídeos, documentos e outros materiais.

    ## INSTRUÇÕES
    Analise a imagem fornecida com atenção aos seguintes aspectos:

    1. **Conteúdo Visual**: O que está representado na imagem?
    2. **Contexto Cultural**: Elementos que remetem ao carnaval, cultura brasileira ou carioca
    3. **Elementos Históricos**: Indícios de época, vestimentas, cenários, objetos
    4. **Pessoas e Ação**: Atividades, expressões, interações sociais
    5. **Atmosfera**: Clima, emoções, energia transmitida pela cena

    ## FORMATO DE SAÍDA
    Gere um JSON válido (usando ```json e ```) com a seguinte estrutura:

    {
      "descricao_curta": "Uma frase concisa descrevendo a cena principal",
      "descricao_longa": "Descrição detalhada e contextualizada incluindo elementos visuais, culturais, históricos e atmosfera",
      "palavras_chave": [
        "lista", "de", "palavras-chave", "relevantes", "para", "indexação"
      ],
      "elementos_visuais": {
        "pessoas": "Descrição das pessoas presentes (quantidade, vestimentas, ações)",
        "cenario": "Descrição do local, ambiente e cenário",
        "objetos": "Objetos e elementos relevantes visíveis",
        "cores_predominantes": ["cor1", "cor2", "cor3"]
      },
      "contexto_temporal": {
        "epoca_estimada": "Estimativa de época/década se identificável",
        "indicadores": "Elementos que indicam a época (vestimentas, tecnologia, etc.)"
      },
      "analise_cultural": {
        "elementos_carnavalescos": "Elementos específicos do carnaval identificados",
        "referencias_culturais": "Referências à cultura carioca, brasileira ou popular",
        "significado": "Significado cultural ou simbólico da cena"
      },
      "qualidade_tecnica": {
        "tipo": "fotografia/vídeo/documento/outro",
        "qualidade": "excelente/boa/regular/baixa",
        "observacoes": "Observações sobre aspectos técnicos (foco, iluminação, etc.)"
      },
      "observacoes_adicionais": "Qualquer observação adicional interessante, curiosa ou relevante sobre a imagem"
    }

    ## DIRETRIZES
    - Seja descritivo e objetivo, mas também sensível ao contexto cultural
    - Use linguagem clara e acessível
    - Destaque elementos únicos ou interessantes
    - Se não conseguir identificar algo com certeza, indique como "não identificável" ou "possivelmente"
    - Evite julgamentos ou interpretações muito subjetivas
    - Foque em preservar o valor histórico e cultural do registro

    ## IMAGEM
    {image_tag}

# =============================================================================
# PROMPT 2: CLASSIFICAÇÃO DE CATEGORIAS
# =============================================================================

classification:
  # ---------------------------------------------------------------------------
  # ZERO-SHOT BASIC: No examples, no class descriptions
  # ---------------------------------------------------------------------------
  zero_shot_basic:
    # JSON Schema para validação da saída
    output_schema:
      type: object
      required:
        - classificacao_categorias
      properties:
        classificacao_categorias:
          type: object
          # Nota: As categorias são dinâmicas, então não podemos validar as keys específicas
          # Mas podemos validar que cada categoria tem a estrutura correta
          patternProperties:
            ".*":
              type: object
              required:
                - valor
                - justificativa
              properties:
                valor:
                  type: integer
                  enum: [0, 1]
                justificativa:
                  type: string
          minProperties: 1

    system_prompt: |
      Você é um especialista em classificação de imagens do carnaval carioca, com profundo conhecimento sobre blocos de rua, escolas de samba e manifestações culturais do Rio de Janeiro.

      Sua tarefa é classificar imagens do acervo histórico do Bloco Suvaco de Cristo em categorias predefinidas, identificando elementos visuais específicos presentes nas fotografias.

    user_prompt: |
      ## CONTEXTO
      Esta imagem faz parte do acervo histórico do Bloco "Suvaco de Cristo", um tradicional
      bloco de carnaval do Rio de Janeiro, Brasil.

      ## TAREFA
      Classifique esta imagem nas categorias listadas abaixo. Para cada categoria, atribua:
      - **valor**: 0 (ausente) ou 1 (presente)
      - **justificativa**: Se valor=1, explique brevemente o que você vê (máx 15 palavras)

      ## CATEGORIAS
      {categories_list}

      ## FORMATO DE SAÍDA
      Gere um JSON válido (usando ```json e ```) com a seguinte estrutura:

      {{
        "classificacao_categorias": {{
          "categoria_1": {{
            "valor": 0,
            "justificativa": ""
          }},
          "categoria_2": {{
            "valor": 1,
            "justificativa": "Descrição breve do que foi identificado"
          }}
        }}
      }}

      ## DIRETRIZES
      - Seja conservador: marque 1 **apenas** se o elemento está **claramente visível**
      - Se houver dúvida, marque 0
      - Justificativas devem ser objetivas e descritivas
      - Não invente elementos que não estão na imagem
      - Foque em evidências visuais concretas

      ## IMAGEM
      {image_tag}

  # ---------------------------------------------------------------------------
  # ZERO-SHOT WITH DESCRIPTIONS: No examples, but with detailed class descriptions
  # ---------------------------------------------------------------------------
  zero_shot_with_descriptions:
    # JSON Schema para validação da saída
    output_schema:
      type: object
      required:
        - classificacao_categorias
      properties:
        classificacao_categorias:
          type: object
