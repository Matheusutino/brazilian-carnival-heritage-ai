              type: object
              required:
                - valor
                - justificativa
              properties:
                valor:
                  type: integer
                  enum: [0, 1]
                justificativa:
                  type: string
          minProperties: 1

    system_prompt: |
      Você é um especialista em classificação de imagens do carnaval carioca, com profundo conhecimento sobre blocos de rua, escolas de samba e manifestações culturais do Rio de Janeiro.

      Sua tarefa é classificar imagens do acervo histórico do Bloco Suvaco de Cristo em categorias predefinidas, identificando elementos visuais específicos presentes nas fotografias.

    user_prompt: |
      ## CONTEXTO
      Esta imagem faz parte do acervo histórico do Bloco "Suvaco de Cristo", um tradicional
      bloco de carnaval do Rio de Janeiro, Brasil.

      ## TAREFA
      Classifique esta imagem nas categorias listadas abaixo. Para cada categoria, atribua:
      - **valor**: 0 (ausente) ou 1 (presente)
      - **justificativa**: Se valor=1, explique brevemente o que você vê (máx 15 palavras)

      ## CATEGORIAS E DESCRIÇÕES
      Abaixo estão as categorias com suas respectivas descrições:

      - **adereços**: Peças ou objetos que complementam fantasias ou são usados para enfeite, como anéis, pulseiras, brincos, colares, cintos, chapéus ou adornos.

      - **baianas**: Trecho do desfile em que está a ala das baianas: formação de mulheres que desfilam nas escolas de samba homenageando as "tias baianas".

      - **bateria**: Membros participantes da bateria ou trecho do desfile em que está a ala da bateria, formada por pessoas que tocam instrumentos de percussão.

      - **camiseta**: Arte, ilustração ou versão física da camiseta oficial do bloco de algum ano.

      - **concentração**: Momento em que os foliões, músicos e organização estão se reunindo antes do início do desfile do bloco. Estamos catalogando como concentração todo material registrado na rua Diamantina e na descida da rua Faro, ou seja, tudo o que acontece antes do grupo chegar na rua Jardim Botânico e no carro de som.

      - **desfile**: Tudo que envolve o momento em que as apresentações do desfile estão efetivamente ocorrendo.

      - **ensaio**: Momento de reunião de membros que serve como etapa de preparação e de testes antes do desfile oficial.

      - **estandarte/bandeira**: Arte, ilustração ou versão física do estandarte ou da bandeira do bloco.

      - **fantasia**: Pessoas no bloco vestidas com qualquer tipo de fantasia de carnaval.

      - **foliões**: Pessoas que estão participando e/ou curtindo o bloco. Pode ser multidão ou pequenos grupos, ou até uma só pessoa.

      - **imprensa**: Qualquer matéria, impressa ou televisiva, de jornal/blog em que há referência ou citação ao bloco.

      - **letra**: Letra dos sambas do bloco.

      - **mestre-sala**: Homem que exerce o papel de mestre-sala do desfile. Está geralmente acompanhado da porta-bandeira, utilizando roupa característica e chapéu.

      - **multidão**: Conjunto grande de pessoas preenchendo as ruas de realização do desfile.

      - **porta-bandeira**: Mulher que exerce o papel de porta-bandeira do desfile. Está geralmente acompanhada do mestre-sala, utilizando roupa característica e segurando a bandeira do bloco.

      - **premiação**: Tudo que envolve a recepção de prêmios para o bloco Suvaco do Cristo.

      - **produção**: Membros ou artefatos que auxiliam ou fazem parte do processo de elaboração, decoração ou acontecimento do bloco.

      - **samba**: Audio ou letra de sambas do bloco Suvaco do Cristo.

      - **serpentina de ouro**: Evento de premiação da Serpentina de Ouro.

      - **show/festa**: Apresentação musical com banda ou artista tocando em um palco. Ou pessoas animadas reunidas em um ambiente, em geral, fechado, celebrando algo. Geralmente o ambiente apresenta decoração festiva, comidas, bebidas e atividades sociais informais. Eventos fora do carnaval, por exemplo: churrasco, feijoada, etc.

      - **suvaquinho**: Ala infantil do bloco composta principalmente por crianças.

      - **outros**: Nenhuma das palavra-chave existentes se adequou bem.

      ## FORMATO DE SAÍDA
      Gere um JSON válido (usando ```json e ```) com a seguinte estrutura:

      {{
        "classificacao_categorias": {{
          "categoria_1": {{
            "valor": 0,
            "justificativa": ""
          }},
          "categoria_2": {{
            "valor": 1,
            "justificativa": "Descrição breve do que foi identificado"
          }}
        }}
      }}

      ## DIRETRIZES
      - Seja conservador: marque 1 **apenas** se o elemento está **claramente visível**
      - Use as descrições fornecidas para guiar sua classificação
      - Se houver dúvida, marque 0
      - Justificativas devem ser objetivas e descritivas
      - Não invente elementos que não estão na imagem
      - Foque em evidências visuais concretas

      ## IMAGEM
      {image_tag}

